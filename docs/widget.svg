<svg width="520" height="480" viewBox="0 0 520 480" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'SF Pro Text','PingFang SC','Segoe UI',system-ui,sans-serif">
  <rect width="520" height="480" fill="#f5f5f7"/>

  <!-- ================= collapsed pill (bottom-right reference) ================= -->
  <g transform="translate(300,432)">
    <rect x="0" y="0" width="176" height="40" rx="20" fill="rgba(255,255,255,.9)" stroke="rgba(0,0,0,.08)"/>
    <circle cx="22" cy="20" r="4.5" fill="#ff3b30"/>
    <text x="38" y="25" font-size="13" font-weight="600" fill="#1d1d1f" font-variant-numeric="tabular-nums">01:15</text>
  </g>

  <!-- ================= expanded panel ================= -->
  <g transform="translate(20,16)">
    <rect width="344" height="408" rx="16" fill="#ffffff" stroke="rgba(0,0,0,.08)"/>
    <rect width="344" height="408" rx="16" fill="none" stroke="rgba(0,0,0,.04)"/>

    <!-- head -->
    <text x="16" y="34" font-size="14" font-weight="600" fill="#1d1d1f">系统声音录制</text>
    <text x="328" y="34" font-size="15" fill="#8e8e93" text-anchor="end">×</text>
    <line x1="0" y1="48" x2="344" y2="48" stroke="rgba(0,0,0,.06)"/>

    <!-- timer -->
    <text x="16" y="88" font-size="30" font-weight="600" fill="#1d1d1f" letter-spacing="-0.5">01:15</text>
    <text x="16" y="106" font-size="12" fill="#6e6e73">正在录制 · 2.3 MB</text>

    <!-- stop button -->
    <rect x="16" y="118" width="312" height="36" rx="10" fill="#1d1d1f"/>
    <text x="172" y="141" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">结束录制</text>

    <!-- storage -->
    <text x="16" y="182" font-size="12" font-weight="600" fill="#6e6e73" letter-spacing="0.4">存放位置</text>
    <rect x="16" y="190" width="240" height="32" rx="8" fill="rgba(0,0,0,.03)" stroke="rgba(0,0,0,.1)"/>
    <text x="26" y="210" font-size="12" fill="#1d1d1f" font-family="ui-monospace,Menlo,Consolas,monospace">C:\Users\you\Rec…</text>
    <rect x="262" y="190" width="42" height="32" rx="8" fill="none" stroke="rgba(0,0,0,.12)"/>
    <text x="283" y="210" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">选择…</text>
    <rect x="308" y="190" width="20" height="32" rx="8" fill="none" stroke="rgba(0,0,0,.12)"/>
    <text x="318" y="210" font-size="12" font-weight="600" fill="#1d1d1f" text-anchor="middle">⌄</text>

    <!-- files label -->
    <text x="16" y="250" font-size="12" font-weight="600" fill="#6e6e73" letter-spacing="0.4">已录文件</text>

    <!-- file rows -->
    <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">
      <rect x="16" y="258" width="312" height="30" rx="8" fill="rgba(0,0,0,.03)"/>
      <text x="24" y="277" fill="#1d1d1f">system-audio-2026-…</text>
      <rect x="248" y="265" width="34" height="16" rx="4" fill="rgba(52,199,89,.16)"/>
      <text x="265" y="277" font-size="10" font-weight="700" fill="#248a3d" text-anchor="middle" font-family="-apple-system,sans-serif">转写</text>
      <text x="320" y="277" fill="#8e8e93" text-anchor="end" font-family="-apple-system,sans-serif">2.3 MB</text>

      <rect x="16" y="292" width="312" height="30" rx="8" fill="rgba(0,0,0,.03)"/>
      <text x="24" y="311" fill="#1d1d1f">system-audio-2026-…</text>
      <rect x="248" y="299" width="34" height="16" rx="4" fill="rgba(52,199,89,.16)"/>
      <text x="265" y="311" font-size="10" font-weight="700" fill="#248a3d" text-anchor="middle" font-family="-apple-system,sans-serif">转写</text>
      <text x="320" y="311" fill="#8e8e93" text-anchor="end" font-family="-apple-system,sans-serif">1.4 MB</text>

      <rect x="16" y="326" width="312" height="30" rx="8" fill="rgba(0,0,0,.03)"/>
      <text x="24" y="345" fill="#1d1d1f">system-audio-2026-…</text>
      <text x="320" y="345" fill="#8e8e93" text-anchor="end" font-family="-apple-system,sans-serif">5.0 MB</text>
    </g>

    <!-- footer note -->
    <text x="16" y="390" font-size="11" fill="#8e8e93">Windows · WASAPI loopback · 完全本地</text>
  </g>
</svg>
